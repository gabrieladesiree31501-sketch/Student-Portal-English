<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>English VI Student Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#f4f6fc; --surf:#fff; --ink:#2a2d44; --mute:#6b6f8a;
      --navy:#364c84; --peri:#95b1ee; --lime:#e7f1a8; --line:#dfe4f3;
      --field:#fbfcff; --acc:#526fae; --soft:#dce7ff; --bad:#ffe9a8;
      --ok:#e7f1a8; --pending:#ddebf7; --idle:#e7e6e6;
      color-scheme:light;
    }
    :root[data-theme="dark"] {
      --bg:#12152a; --surf:#1b2040; --ink:#e8ebfa; --mute:#a0a6cc;
      --navy:#95b1ee; --peri:#4a65ad; --lime:#d6e68a; --line:#2c3260;
      --field:#12152a; --acc:#95b1ee; --soft:#2c3a66; --bad:#8a6b1c;
      --ok:#5f7a2a; --pending:#2f4a78; --idle:#3a3d52; color-scheme:dark;
    }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font:400 15px/1.5 Comfortaa,system-ui,sans-serif; }
    button,input { font:inherit; }
    button { cursor:pointer; }
    :focus-visible { outline:3px solid var(--peri); outline-offset:2px; }

    .login-page { min-height:100vh; display:flex; flex-direction:column; max-width:1120px; margin:auto; padding:0 20px; }
    .topbar { display:flex; justify-content:space-between; align-items:center; gap:20px; padding:24px 0 18px; border-bottom:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:11px; color:var(--navy); font-size:13px; font-weight:700; letter-spacing:.13em; }
    .brand-mark { display:grid; place-items:center; width:42px; height:42px; border-radius:13px; background:var(--soft); }
    .brand small { display:block; margin-top:3px; color:var(--mute); font-size:9px; letter-spacing:.17em; font-weight:400; }
    .term { display:flex; align-items:center; gap:9px; color:var(--mute); font-size:10px; font-weight:700; letter-spacing:.12em; }
    .term-dot { width:7px; height:7px; background:var(--navy); border-radius:50%; box-shadow:0 0 0 4px var(--soft); }

    .login-layout { flex:1; display:grid; place-content:center; justify-items:center; gap:27px; padding:46px 0 54px; }
    .welcome { width:min(100%,780px); text-align:center; }
    h1 { margin:0 0 11px; color:var(--navy); font-size:clamp(34px,4.2vw,49px); line-height:1.18; letter-spacing:-.045em; }
    .byline { margin:0 0 13px; color:var(--acc); font-size:14px; line-height:1.6; letter-spacing:.07em; text-transform:uppercase; font-weight:700; }
    .intro { max-width:680px; margin:0 auto; color:var(--mute); font-size:13px; line-height:1.8; }
    .login-card { width:min(100%,470px); padding:29px 30px 23px; background:var(--surf); border:1px solid var(--line); border-radius:21px; box-shadow:0 12px 34px rgba(54,76,132,.08); }
    .lock-icon { display:grid; place-items:center; width:64px; height:64px; margin:0 auto 14px; color:var(--navy); }
    .eyebrow { color:var(--acc); text-align:center; font-size:10px; font-weight:700; letter-spacing:.17em; }
    .login-card h2 { margin:9px 0 8px; color:var(--navy); font-size:25px; letter-spacing:-.05em; text-align:center; }
    .card-intro { margin:0 0 24px; color:var(--mute); font-size:11px; line-height:1.7; text-align:center; }
    form { display:grid; gap:17px; }
    label { display:grid; gap:8px; color:var(--mute); font-size:10px; font-weight:700; }
    .input-wrap { display:flex; align-items:center; gap:10px; height:46px; padding:0 12px; color:var(--acc); background:var(--field); border:1px solid var(--line); border-radius:10px; }
    .input-wrap:focus-within { border-color:var(--peri); box-shadow:0 0 0 3px rgba(149,177,238,.3); }
    .input-wrap input { width:100%; min-width:0; padding:0; border:0; outline:0; background:transparent; color:var(--ink); font-size:12px; }
    .input-wrap input::placeholder { color:var(--mute); opacity:.7; }
    .eye { border:0; background:transparent; color:var(--acc); font-size:16px; }
    .primary { display:flex; justify-content:center; align-items:center; width:100%; height:46px; border:0; border-radius:10px; background:var(--navy); color:var(--bg); font-size:12px; font-weight:700; }
    .primary:hover { opacity:.92; transform:translateY(-1px); }
    .error { min-height:18px; margin:10px 0 0; color:#b3261e; text-align:center; font-size:11px; }
    .login-foot { display:flex; align-items:center; justify-content:center; gap:7px; margin-top:20px; padding-top:18px; border-top:1px solid var(--line); color:var(--mute); font-size:9px; text-align:center; }
    .theme-btn { justify-self:center; border:1.5px solid var(--line); border-radius:999px; background:var(--surf); color:var(--navy); padding:11px 22px; font-size:12px; font-weight:700; }
    .footer { display:flex; justify-content:space-between; gap:14px; padding:17px 2px 20px; border-top:1px solid var(--line); color:var(--mute); font-size:9px; letter-spacing:.12em; }

    main.dashboard { max-width:760px; margin:auto; padding:28px 18px 56px; }
    .dashboard h1 { margin-bottom:4px; font-size:23px; }
    .sub { color:var(--mute); margin:0 0 20px; font-size:13px; }
    .card { background:var(--surf); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:16px; }
    .dashboard h2 { margin:0 0 12px; color:var(--navy); font-size:15px; }
    .hero { display:grid; grid-template-columns:auto 1fr; gap:22px; align-items:center; }
    .ring { --p:70; width:150px; height:150px; border-radius:50%; background:conic-gradient(var(--navy) calc(var(--p)*1%),var(--line) 0); display:grid; place-items:center; }
    .ring div { width:112px; height:112px; border-radius:50%; background:var(--surf); display:grid; place-items:center; text-align:center; }
    .ring b { font-size:34px; line-height:1; color:var(--navy); }
    .ring small { display:block; color:var(--mute); font-size:11px; margin-top:2px; }
    .tag { display:inline-block; padding:4px 12px; border-radius:99px; background:var(--lime); color:#2a2d44; font-size:13px; font-weight:600; }
    .bar { margin:14px 0; }
    .bar .t { display:flex; justify-content:space-between; gap:8px; font-size:13px; margin-bottom:5px; }
    .bar small { display:block; color:var(--mute); font-size:11px; }
    .track { height:12px; border-radius:99px; background:var(--line); overflow:hidden; }
    .fill { height:100%; border-radius:99px; background:var(--navy); }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    td { padding:10px 4px; border-top:1px solid var(--line); }
    tr:first-child td { border-top:0; }
    td.r { text-align:right; white-space:nowrap; }
    .chip { display:inline-block; padding:3px 10px; border-radius:99px; font-size:12px; }
    .chip.ok { background:var(--ok); }.chip.bad { background:var(--bad); }.chip.pending { background:var(--pending); }
    .note { border-left:5px solid #9fbf3a; background:var(--ok); border-radius:10px; padding:12px 14px; }
    .foot { display:flex; justify-content:flex-end; align-items:center; }
    .ghost { border:0; background:none; color:var(--mute); padding:6px 0; text-decoration:underline; }

    @media(max-width:640px) {
      .login-page { padding:0 15px; }.topbar { padding-top:18px; }.term { font-size:8px; letter-spacing:.06em; }
      .brand { font-size:10px; }.brand-mark { width:36px; height:36px; }.login-layout { padding:32px 0 30px; gap:22px; }
      h1 { font-size:31px; }.byline { font-size:11px; }.intro { font-size:11px; }.login-card { padding:24px 21px 21px; }
      .hero { grid-template-columns:1fr; justify-items:center; text-align:center; }.footer { font-size:8px; }
    }
    @media (prefers-reduced-motion:reduce) { * { scroll-behavior:auto!important; } }
  </style>
</head>
<body>
  <main id="root"></main>
  <script>
    const root = document.querySelector('#root');

    function loginView() {
      root.className = 'login-page';
      root.innerHTML = `
        <header class="topbar">
          <div class="brand"><span class="brand-mark">✦</span><span>ENGLISH VI 4D<small>PROF. DESIRÉE GARCÍA</small></span></div>
          <div class="term"><span class="term-dot"></span>PARTIAL 1 · 2026–2027</div>
        </header>
        <section class="login-layout">
          <div class="welcome"><h1>Welcome to your English course</h1><p class="byline">English VI 4D · Prof. Desirée García</p><p class="intro">Welcome to your English VI academic space. Check your progress, review your activities and keep moving forward.</p></div>
          <section class="login-card">
            <div class="lock-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/><circle cx="12" cx="15.5" r="1.3" fill="currentColor"/></svg></div>
            <div class="eyebrow">STUDENT ACCESS</div><h2>Sign in to continue.</h2>
            <p class="card-intro">Sign in with your Student ID and the password provided by your teacher.</p>
            <form id="loginForm">
              <label>Student ID<span class="input-wrap"><span>▣</span><input id="studentId" autocomplete="username" placeholder="e.g. D-1234567" required></span></label>
              <label>Password<span class="input-wrap"><span>⌑</span><input id="password" type="password" autocomplete="current-password" placeholder="XXXX-XXXX" required><button type="button" class="eye" id="eye" aria-label="Show password">◉</button></span></label>
              <button class="primary" type="submit">Sign in <span aria-hidden="true">&nbsp;→</span></button>
            </form>
            <p class="error" id="error" role="alert"></p>
            <div class="login-foot"><span>▣</span>Your grades are visible only to you and your teacher.</div>
          </section>
          <button class="theme-btn" id="themeToggle">Switch theme</button>
        </section>
        <footer class="footer"><span>ENGLISH VI · ACADEMIC PROGRESS</span><span>Private learning space</span></footer>`;

      document.querySelector('#eye').onclick = () => {
        const input=document.querySelector('#password'), showing=input.type==='text';
        input.type=showing?'password':'text'; document.querySelector('#eye').textContent=showing?'◉':'◌';
      };
      document.querySelector('#themeToggle').onclick = () => {
        document.documentElement.dataset.theme = document.documentElement.dataset.theme==='dark'?'light':'dark';
      };
      document.querySelector('#loginForm').onsubmit = event => {
        event.preventDefault();
        const id=document.querySelector('#studentId').value.trim(), pw=document.querySelector('#password').value;
        if(!id || !pw) document.querySelector('#error').textContent='Enter both your Student ID and password.';
        else dashboardView(id);
      };
    }

    function chip(text, status) { return `<span class="chip ${status}">${text}</span>`; }

    function dashboardView(id) {
      root.className='dashboard';
      root.innerHTML=`
        <h1>Hello, Student</h1><p class="sub">${id} · English VI · Partial 1</p>
        <div class="card hero"><div class="ring"><div><span><b>7.0</b><small>out of 10</small></span></div></div><div><p><span class="tag">Passing</span></p><p style="margin:0;color:var(--mute);font-size:13px">70.0 of 100 points earned. This grows as your teacher enters each grade.</p></div></div>
        <div class="card"><h2>Notes from your teacher</h2><div class="note">Keep reviewing your worksheets and continue preparing for the partial exam.</div></div>
        <div class="card"><h2>How your grade is built</h2>
          ${bar('Assignments','30%',23,30,'4 worksheets 23% + mid-partial quiz 7%')}${bar('Lab activities','20%',15,20,'Workbook 15% + notes 5%')}${bar('Partial exam','50%',32,50,'ALCPT exam, extra points can be added')}
        </div>
        <div class="card"><h2>Assignments</h2><table>
          ${row('Worksheet 1','4.5 / 5','Graded','ok')}${row('Worksheet 2','4.0 / 5','Graded','ok')}${row('Worksheet 3','—','Not due','pending')}${row('Worksheet 4','—','Not due','pending')}${row('Mid-partial quiz','72 / 100','Graded','ok')}
        </table></div>
        <div class="card"><h2>Lab activities and exam</h2><table>${row('Workbook','85 / 100','Graded','ok')}${row('Notes','8 / 10','Graded','ok')}${row('Partial exam (ALCPT)','64 / 100','Pending grading','pending')}</table></div>
        <div class="foot"><button class="ghost" id="signOut">Sign out</button></div>`;
      document.querySelector('#signOut').onclick=loginView;
    }

    function bar(label,weight,value,max,detail){ return `<div class="bar"><div class="t"><span><b>${label}</b> <span class="tag" style="padding:1px 8px;font-size:11px">${weight}</span><small>${detail}</small></span><span>${value.toFixed(2)} / ${max}</span></div><div class="track"><div class="fill" style="width:${value/max*100}%"></div></div></div>`; }
    function row(label,score,text,status){ return `<tr><td>${label}</td><td class="r">${score}</td><td class="r">${chip(text,status)}</td></tr>`; }

    loginView();
  </script>
</body>
</html>
